AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: RecallMatch - FDA medical device recall matching backend

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.14

Resources:

  RecallMatchApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  ReclaroInventoryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReclaroAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RecallMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: recallmatch-api
      CodeUri: .
      Handler: backend.aws_handler.handler
      Environment:
        Variables:
          RECLARO_S3_BUCKET: !Ref ReclaroInventoryBucket
          RECLARO_DYNAMODB_TABLE: !Ref ReclaroAuditTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ReclaroInventoryBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ReclaroAuditTable
      Events:

        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref RecallMatchApi
            Path: /{proxy+}
            Method: ANY

        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref RecallMatchApi
            Path: /
            Method: ANY

Outputs:

  RecallMatchApiUrl:
    Description: RecallMatch API Gateway URL
    Value: !Sub "https://${RecallMatchApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  ReclaroInventoryBucketName:
    Description: S3 bucket used for uploaded hospital inventory CSV files
    Value: !Ref ReclaroInventoryBucket

  ReclaroAuditTableName:
    Description: DynamoDB table used for audit run persistence
    Value: !Ref ReclaroAuditTable